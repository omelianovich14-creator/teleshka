<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Тележка</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--text:#1d1b26;--muted:#7b7890;--line:#e6e2f0;--accent:#7c5cff;--mine:var(--accent);--theirs:#ece8f7;--theirs-t:#1d1b26;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12111a;--card:#1c1a27;--text:#f1eefb;--muted:#9a96b3;--line:#2c2940;--theirs:#2a2740;--theirs-t:#f1eefb}}
:root[data-theme="dark"]{--bg:#12111a;--card:#1c1a27;--text:#f1eefb;--muted:#9a96b3;--line:#2c2940;--theirs:#2a2740;--theirs-t:#f1eefb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:800;font-size:20px;border-bottom:1px solid var(--line);background:var(--card)}
header .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ff6ba0);display:grid;place-items:center;font-size:18px}
header small{margin-left:auto;font-weight:500;font-size:13px;color:var(--muted)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;padding:10px 0 8px;background:none;border:0;color:var(--muted);font:600 12px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:22px}
nav button.on{color:var(--accent)}
/* feed */
#feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;background:#000}
.clip{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000}
.clip video{width:100%;height:100%;object-fit:contain;background:#000}
.clip .info{position:absolute;left:14px;right:80px;bottom:18px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.clip .info b{display:block;font-size:16px}
.clip .side{position:absolute;right:12px;bottom:28px;display:flex;flex-direction:column;gap:16px;align-items:center;color:#fff}
.clip .side button{background:rgba(0,0,0,.45);border:0;color:#fff;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer}
.clip .side button.liked{background:#ff3b6b}
.clip .side i{font-style:normal;font-size:13px;margin-top:-12px}
.empty{margin:auto;text-align:center;color:var(--muted);padding:30px}
.empty .big{font-size:56px}
.fab{position:absolute;top:12px;right:12px;z-index:5;background:var(--accent);color:#fff;border:0;border-radius:22px;padding:10px 16px;font:700 14px inherit;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
/* chat */
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:18px;background:var(--theirs);color:var(--theirs-t);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.m.me{background:var(--mine);color:#fff;align-self:flex-end}
.m .n{font-size:12px;font-weight:700;opacity:.7;display:block}
.m .t{font-size:11px;opacity:.6;display:block;text-align:right}
form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--card)}
input[type=text]{flex:1;padding:12px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none}
.send{width:46px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:20px;cursor:pointer}
/* settings */
#v-set{overflow-y:auto;padding:16px;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.box h3{margin:0 0 10px;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);border:0;position:relative;cursor:pointer;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--accent)}.sw.on::after{left:23px}
.dots{display:flex;gap:10px}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.dot.on{border-color:var(--text)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.alt{background:var(--theirs);color:var(--text)}
/* modal */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end}
#modal.on{display:flex}
#modal .sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:20px;display:flex;flex-direction:column;gap:12px}
#snow{position:fixed;inset:0;pointer-events:none;z-index:50}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:14px;font-size:14px;z-index:60;display:none}
#list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}#list.hide{display:none}
#ch{display:none;flex:1;min-height:0;flex-direction:column}#ch.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}.bar b{flex:1}.bar button{background:none;border:0;font-size:24px;color:var(--text);cursor:pointer}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}.item small{display:block;color:var(--muted)}
.m.gift,.m.gift.me{background:none;color:var(--text);font-size:56px;line-height:1.1;padding:0}
.ban{height:90px;border-radius:12px;margin-bottom:-32px}
.chip{padding:6px 12px;border-radius:14px;background:var(--theirs);color:var(--text);border:2px solid transparent;cursor:pointer;font-size:14px}.chip.on{border-color:var(--accent)}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gg button{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:34px;color:var(--text);cursor:pointer}.gg small{display:block;font-size:13px}
#mb{display:flex;flex-direction:column;gap:10px}.btn:disabled{opacity:.5}
.gc{position:relative;overflow:hidden;border-radius:16px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
.gc .pt{position:absolute;inset:0;opacity:.28;font-size:16px;line-height:2;letter-spacing:9px;overflow:hidden;word-break:break-all;text-align:center}
.gc .ge{font-size:50px;position:relative;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}.gc b,.gc small{position:relative;font-size:13px}.gc small{opacity:.9;font-size:11px}
.gc .r{position:absolute;top:6px;left:6px;font-style:normal;font-size:9px;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:8px}
.gc.sh::after{content:'📌';position:absolute;top:4px;right:6px;font-size:14px}.gc.leg{box-shadow:0 0 16px 2px #ffc83d}.gg>div{cursor:pointer}
#modal .sheet{max-height:88%;overflow-y:auto}
html{background:transparent}.view{background:var(--bg)}.box{flex-shrink:0}
#emo{display:none;flex-wrap:wrap;gap:6px;padding:8px 10px;background:var(--card);border-top:1px solid var(--line)}#emo.on{display:flex}#emo span{font-size:26px;cursor:pointer}
.send.alt{background:var(--theirs);color:var(--text);font-size:20px}
#bdg{display:none;position:absolute;top:6px;left:56%;width:10px;height:10px;border-radius:50%;background:#ff3b6b}#bdg.on{display:block}
body.dk{--bg:#12111a;--card:#1c1a27;--text:#f1eefb;--muted:#9a96b3;--line:#2c2940;--theirs:#2a2740;--theirs-t:#f1eefb}
body.lt{--bg:#f6f4fb;--card:#fff;--text:#1d1b26;--muted:#7b7890;--line:#e6e2f0;--theirs:#ece8f7;--theirs-t:#1d1b26}
nav button svg{display:block}
.ge svg{width:66px;height:66px;overflow:visible}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(3px,-7px) rotate(5deg)}}
.a-frog svg,.a-ghost svg{animation:bob 1.7s ease-in-out infinite}.a-heart svg{animation:pulse 1s ease-in-out infinite}
.a-frog .pu,.a-ghost .pu{transform-box:fill-box;transform-origin:center;animation:blink 3s infinite}
.a-bear,.a-rose,.a-cake,.a-crown{animation:bob 2s ease-in-out infinite}.a-gem{animation:pulse 1.6s ease-in-out infinite}.a-rocket{animation:fly 1.2s ease-in-out infinite}
.hs{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px}.mini{width:92px;flex:none;border-radius:16px;cursor:pointer}.mini.sel{outline:3px solid var(--accent);outline-offset:1px}
.mini .ge{font-size:30px}.mini .ge svg{width:44px;height:44px}.mini b{font-size:11px}.mini small{font-size:10px}.mini .r{display:none}
@keyframes twk{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.1) rotate(25deg);opacity:1}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}50%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.sp{transform-box:fill-box;transform-origin:center;animation:twk 1.8s ease-in-out infinite}.bb{animation:rise 2s ease-in infinite}.bb+.bb{animation-delay:1s}
.a-cat svg,.a-lamp svg,.a-bag svg,.a-perfume svg,.a-trophy svg,.a-helmet svg,.a-potion svg,.a-glasses svg,.a-cap svg{animation:bob 2s ease-in-out infinite}
.a-ring svg,.a-star svg{animation:pulse 1.5s ease-in-out infinite}.a-balloon svg{animation:fly 2.2s ease-in-out infinite}
.a-cat .pu{transform-box:fill-box;transform-origin:center;animation:blink 3.4s infinite}
#rb{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border-top:1px solid var(--line);font-size:13px}#rb.on{display:flex}
#rb div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#rb b{color:var(--accent)}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.rc{font-size:12px;padding:2px 8px;border-radius:12px;background:rgba(127,127,127,.25);cursor:pointer}.rc.on{outline:2px solid var(--accent)}
.rq{border-left:3px solid currentColor;padding-left:8px;margin-bottom:5px;font-size:12px;opacity:.85;cursor:pointer;overflow:hidden;text-overflow:ellipsis}.rq b{display:block}
@keyframes fl{0%,100%{filter:none}30%{filter:brightness(1.5)}}.m.flash{animation:fl 1.1s}
.pg{display:inline-block;width:20px;height:20px;vertical-align:-5px}.pg svg{width:20px;height:20px}
.tt{font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;background:linear-gradient(90deg,#7c5cff,#ff6ba0);color:#fff;vertical-align:2px;-webkit-text-fill-color:#fff}
.ge.a-bear,.ge.a-rose,.ge.a-cake,.ge.a-crown,.ge.a-gem,.ge.a-rocket{animation:none}
.a-bear svg,.a-rose svg,.a-cake svg,.a-crown svg,.a-frogh svg,.a-icecream svg,.a-donut svg,.a-letter svg,.a-giftbox svg,.a-coffee svg,.a-horseshoe svg,.a-watch svg,.a-ringbox svg{animation:bob 2.2s ease-in-out infinite}
.a-gem svg{animation:pulse 1.6s ease-in-out infinite}.a-rocket svg{animation:fly 1.2s ease-in-out infinite}
.hb{transform-box:fill-box;transform-origin:center;animation:pulse 1s ease-in-out infinite}
.sec{transform-origin:50px 50px;animation:spin 6s steps(60) infinite}
.ex{transform-box:fill-box;transform-origin:50% 0;animation:flame .25s ease-in-out infinite alternate}
.fl2{transform-box:fill-box;transform-origin:50% 100%;animation:flame2 .5s ease-in-out infinite alternate}
.a-frogh .pu,.a-bear .pu{transform-box:fill-box;transform-origin:center;animation:blink 3.2s infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes flame{from{transform:scaleY(1)}to{transform:scaleY(1.3)}}@keyframes flame2{from{transform:scale(1,1)}to{transform:scale(.85,1.15)}}
</style>
<meta name="apple-mobile-web-app-title" content="Тележка">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script>
/* Firebase (база) и Cloudinary (файлы) вместо хостинга Claude */
(function(){
  let fs=null;
  try{firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();fs.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){console.error(e)}
  async function upload(file){
    const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CLOUDINARY_PRESET);
    const r=await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY_CLOUD+'/auto/upload',{method:'POST',body:fd});
    const j=await r.json();if(!j.secure_url)throw new Error(j.error&&j.error.message||'upload');
    return {id:j.public_id,url:j.secure_url};
  }
  let authP=null;
  function gate(){
    if(authP)return authP;
    return authP=new Promise(res=>{
      const au=firebase.auth(),ov=document.createElement('div');
      const inp='padding:13px 14px;border-radius:14px;border:1px solid #e6e2f0;font:16px inherit;outline:none;width:100%';
      const btn='border:0;border-radius:14px;padding:13px;font:700 16px inherit;cursor:pointer;';
      ov.style.cssText='position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7c5cff,#ff6ba0);padding:20px;font-family:-apple-system,"Segoe UI",sans-serif';
      ov.innerHTML='<div style="background:#fff;color:#1d1b26;border-radius:22px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px"><div style="font-size:26px;font-weight:800">🛒 Тележка</div><div style="color:#7b7890;font-size:14px">Войди или создай аккаунт. Пароль спрашивается только при входе.</div><input id="lg-u" placeholder="юзернейм (a-z, 0-9, _)" autocapitalize="none" autocorrect="off" style="'+inp+'"><input id="lg-p" type="password" placeholder="пароль (от 6 символов)" style="'+inp+'"><div id="lg-e" style="color:#d33;font-size:14px;min-height:18px"></div><button id="lg-in" style="'+btn+'background:#7c5cff;color:#fff">Войти</button><button id="lg-up" style="'+btn+'background:#ece8f7;color:#1d1b26">Создать аккаунт</button></div>';
      const $=q=>ov.querySelector(q);
      async function go(up){
        const u=$('#lg-u').value.trim().toLowerCase().replace(/^@/,''),p=$('#lg-p').value,e=$('#lg-e');e.textContent='';
        if(!/^[a-z0-9_]{3,20}$/.test(u))return e.textContent='Юзернейм: 3–20 символов, a-z, 0-9, _';
        if(p.length<6)return e.textContent='Пароль: минимум 6 символов';
        try{const m=u+'@telezhka.app';up?await au.createUserWithEmailAndPassword(m,p):await au.signInWithEmailAndPassword(m,p)}
        catch(er){const t={'auth/email-already-in-use':'Такой юзернейм уже занят','auth/invalid-credential':'Неверный юзернейм или пароль','auth/wrong-password':'Неверный юзернейм или пароль','auth/user-not-found':'Неверный юзернейм или пароль','auth/operation-not-allowed':'В Firebase не включён вход по паролю','auth/network-request-failed':'Нет связи с интернетом','auth/too-many-requests':'Слишком много попыток, подожди'};e.textContent=t[er.code]||('Ошибка: '+er.code)}
      }
      $('#lg-in').onclick=()=>go(false);$('#lg-up').onclick=()=>go(true);
      au.onAuthStateChanged(u=>{
        if(u){ov.remove();window.LOGIN_NAME=(u.email||'').split('@')[0];res(u)}
        else if(!ov.isConnected)document.body.appendChild(ov);
      });
    });
  }
  window.claude={use:async n=>{
    if(n==='db')return fs;
    if(n==='assets')return {upload};
    if(n==='user'){
      const lo=document.getElementById('lo');
      if(lo)lo.onclick=()=>firebase.auth().signOut().then(()=>{try{localStorage.removeItem('uid')}catch(e){}location.reload()});
      return {id:async()=>(await gate()).uid};
    }
    return null;
  }};
})();
</script>
</head>
<body>
<canvas id="snow"></canvas>
<div id="app">
  <header><div class="logo">🛒</div>Тележка<small id="who"></small></header>
  <main>
    <section class="view on" id="v-feed">
      <button class="fab" id="up">＋ Видео</button>
      <div id="feed"><div class="empty"><div class="big">🎬</div>Загрузка…</div></div>
    </section>
    <section class="view" id="v-chat">
      <div id="list"></div><div id="ch"><div class="bar"><button id="bk">‹</button><b id="ct"></b><button id="gf">🎁</button><button id="dl">🗑</button></div><div id="msgs"></div>
      <div id="rb"></div><div id="emo"></div><form id="f"><button type="button" class="send alt" id="em">😊</button><button type="button" class="send alt" id="ph">📎</button><input type="text" id="inp" placeholder="Сообщение…" autocomplete="off" maxlength="1000"><button class="send" type="submit">➤</button></form></div>
    </section>
    <section class="view" id="v-play" style="overflow-y:auto;padding:16px;gap:14px"><div style="display:flex;gap:8px;flex-shrink:0"><button class="btn" id="pt1" style="flex:1">🎡 Рулетка</button><button class="btn alt" id="pt2" style="flex:1">⬆️ Апгрейд</button></div><div class="box" id="wbox"></div><div class="box" id="ubox" style="display:none"></div></section>
    <section class="view" id="v-set">
      <div class="box" id="nbox"></div><div class="box" id="adm" style="display:none"></div><div class="box" id="prof"></div><div class="box" id="ebox"></div><div class="box" id="pbox"></div><div class="box"><h3>🎨 Кастомизация</h3>
        <div class="row"><span>Тёмная тема</span><button class="sw" id="sw-dark"></button></div>
        <div class="row"><span>❄️ Снег</span><button class="sw" id="sw-snow"></button></div>
        <div class="row"><span>Цвет</span><div class="dots" id="dots"></div></div>
      </div>
      <div class="box"><h3>👤 Профиль</h3>
        <div class="row"><span id="nm"></span><span style="display:flex;gap:6px"><button class="btn alt" id="rn">Сменить ник</button><button class="btn alt" id="lo">Выйти</button></span></div>
      </div>
    </section>
  </main>
  <nav>
    <button class="on" data-v="feed"><span><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4.5"/><path d="M10 9v6l5-3z" fill="currentColor"/></svg></span>Лента</button>
    <button data-v="chat" style="position:relative"><span><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.2 7.6L3.5 20.5l1.5-4.7A8.5 8.5 0 1 1 21 11.5z"/><circle cx="8.5" cy="11.5" r=".8" fill="currentColor"/><circle cx="12.5" cy="11.5" r=".8" fill="currentColor"/><circle cx="16.5" cy="11.5" r=".8" fill="currentColor"/></svg></span>Чат<i id="bdg"></i></button>
    <button data-v="play"><span><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v6.5M12 14.5V21M3 12h6.5M14.5 12H21"/></svg></span>Игры</button><button data-v="set"><span><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></span>Настройки</button>
  </nav>
  <div id="modal"><div class="sheet">
    <b id="mt"></b><div id="mb"></div>
  </div></div>
  <div id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const COLORS=['#7c5cff','#ff4f8b','#18b4a6','#ff9f1c'];
let S={dark:store.get('dark',null),snow:store.get('snow',false),accent:store.get('accent',COLORS[0]),name:store.get('name','')};
let db=null,uid=store.get('uid',null);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}

/* ---- customization ---- */
function applyTheme(){
  const r=document.documentElement;
  
  r.style.setProperty('--accent',S.accent);
  const isDark=S.dark===null?matchMedia('(prefers-color-scheme:dark)').matches:S.dark;
  $('#sw-dark').classList.toggle('on',isDark);document.documentElement.style.colorScheme=isDark?'dark':'light';document.body.className=isDark?'dk':'lt';
  $('#sw-snow').classList.toggle('on',S.snow);
  document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',d.dataset.c===S.accent));
  snowOn(S.snow);
}
$('#sw-dark').onclick=()=>{const cur=S.dark===null?matchMedia('(prefers-color-scheme:dark)').matches:S.dark;S.dark=!cur;store.set('dark',S.dark);applyTheme()};
$('#sw-snow').onclick=()=>{S.snow=!S.snow;store.set('snow',S.snow);applyTheme()};
COLORS.forEach(c=>{const d=document.createElement('div');d.className='dot';d.dataset.c=c;d.style.background=c;d.onclick=()=>{S.accent=c;store.set('accent',c);applyTheme()};$('#dots').append(d)});

/* ---- snow ---- */
const cv=$('#snow'),cx=cv.getContext('2d');let flakes=[],raf=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',size);size();
function snowOn(on){
  cancelAnimationFrame(raf);cx.clearRect(0,0,cv.width,cv.height);
  if(!on)return;
  flakes=Array.from({length:90},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:1+Math.random()*3,v:.4+Math.random()*1.2,d:Math.random()*6}));
  (function tick(){
    cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle='rgba(255,255,255,.9)';cx.shadowColor='rgba(120,120,160,.6)';cx.shadowBlur=3;
    for(const f of flakes){f.y+=f.v;f.d+=.02;f.x+=Math.sin(f.d)*.5;if(f.y>cv.height){f.y=-5;f.x=Math.random()*cv.width}
      cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill()}
    raf=requestAnimationFrame(tick)})();
}

/* ---- tabs ---- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
  if(b.dataset.v==='chat'){const m=$('#msgs');m.scrollTop=m.scrollHeight}
  watchVideos();
});

/* ---- modal ---- */
function modal(title,html){$('#mt').textContent=title;$('#mb').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal'&&S.name)closeModal()};
function askName(){
  modal('Как тебя зовут?','<input type="text" id="nn" maxlength="20" placeholder="Твой ник" style="width:100%;margin-bottom:10px"><button class="btn" id="ok" style="width:100%">Готово</button>');
  $('#nn').value=S.name;
  $('#ok').onclick=()=>{const v=$('#nn').value.trim();if(!v)return;S.name=v;store.set('name',v);closeModal();$('#who').textContent=v;$('#nm').textContent=v};
}
$('#rn').onclick=askName;

/* ---- chat ---- */
function renderMsgs(snap){
  const box=$('#msgs'),atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.innerHTML=snap.docs.map(d=>{const m=d.data(),me=m.uid===uid;
    const t=m.ts?new Date(m.ts).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):'';
    return `<div class="m ${me?'me':''}">${me?'':`<span class="n">${nameHTML(PR[m.uid]||{name:m.name})}</span>`}${esc(m.text)}<span class="t">${t}</span></div>`}).join('')||'<div class="empty">Напиши первое сообщение 👋</div>';
  if(atEnd)box.scrollTop=box.scrollHeight;
}
$('#f').onsubmit=async e=>{e.preventDefault();
  const t=$('#inp').value.trim();if(!t||!db)return;$('#inp').value='';
  try{await db.collection('messages').add({text:t,name:S.name,uid,ts:Date.now()});const m=$('#msgs');m.scrollTop=m.scrollHeight}
  catch(err){toast('Не удалось отправить');$('#inp').value=t}};

/* ---- feed ---- */
let likes={},vids=[],io;
function watchVideos(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(!v)return;
    if(e.isIntersecting&&$('#v-feed').classList.contains('on')){v.play().catch(()=>{})}else v.pause()}),{threshold:.7});
  document.querySelectorAll('.clip').forEach(c=>io.observe(c));
}
function renderFeed(){
  const f=$('#feed');
  if(!vids.length){f.innerHTML='<div class="empty"><div class="big">🎬</div>Пока пусто.<br>Нажми «＋ Видео» и загрузи первое!</div>';return}
  const top=f.scrollTop;
  f.innerHTML=vids.map(v=>{const ls=likes[v.id]||[],liked=ls.includes(uid);
    return `<div class="clip" data-id="${v.id}"><video src="${esc(v.url)}" playsinline loop muted preload="metadata"></video>
    <div class="info"><b>@${esc(v.name||'?')}</b>${esc(v.caption||'')}</div>
    <div class="side"><button data-a="like" class="${liked?'liked':''}">♥</button><i>${ls.length}</i>
    <button data-a="snd">🔇</button>${v.uid===uid?'<button data-a="del">🗑</button>':''}</div></div>`}).join('');
  f.scrollTop=top;watchVideos();
}
$('#feed').onclick=async e=>{
  const b=e.target.closest('button');const clip=e.target.closest('.clip');if(!clip)return;
  const id=clip.dataset.id,vid=clip.querySelector('video');
  if(!b){vid.paused?vid.play():vid.pause();return}
  if(b.dataset.a==='snd'){vid.muted=!vid.muted;b.textContent=vid.muted?'🔇':'🔊'}
  if(b.dataset.a==='like'){const r=db.doc('likes/'+id+'_'+uid);
    try{(likes[id]||[]).includes(uid)?await r.delete():(await r.set({vid:id,uid}),reward(id))}catch(err){toast('Ошибка')}}
  if(b.dataset.a==='del'&&confirm('Удалить видео?')){try{await db.doc('videos/'+id).delete()}catch(err){toast('Ошибка')}}
};
$('#up').onclick=()=>{
  modal('Новое видео','<input type="file" id="file" accept="video/*" style="margin-bottom:6px"><input type="text" id="cap" maxlength="120" placeholder="Подпись (необязательно)" style="width:100%"><button class="btn" id="go">Загрузить</button><small style="color:var(--muted)">Размер до 20 МБ</small>');
  $('#go').onclick=async()=>{
    const file=$('#file').files[0];if(!file)return toast('Выбери видео');
    if(file.size>20*1024*1024)return toast('Файл больше 20 МБ');
    $('#go').disabled=true;$('#go').textContent='Загружаю…';
    try{
      const assets=await claude.use('assets');
      if(!assets)throw new Error('no-assets');
      const r=await assets.upload(file);
      await db.collection('videos').add({url:r.url,assetId:r.id,caption:$('#cap').value.trim(),name:S.name,uid,ts:Date.now()});
      closeModal();toast('Видео опубликовано ✓');postReward();
    }catch(err){closeModal();toast(err.message==='no-assets'?'У тебя нет права загружать файлы':'Не удалось загрузить')}
  };
};

/* ---- profiles, DMs, gifts, currency ---- */
const FONTS={'Обычный':'inherit','Рукописный':"'Segoe Script','Bradley Hand',cursive",'Моно':'ui-monospace,Menlo,monospace','Серифный':'Georgia,serif'};
const BANNERS=['linear-gradient(135deg,#7c5cff,#ff6ba0)','linear-gradient(135deg,#18b4a6,#2b6cff)','linear-gradient(135deg,#ff9f1c,#ff4f8b)','linear-gradient(135deg,#222,#667)'];
const GIFTS=[['🧸',10],['🌹',25],['🎂',40],['💎',100],['🚀',250],['👑',500]],CUR='🛞';
const PR={},G=[];let P=null,TH=[],unM=null,cur={path:'messages',gen:1};
const save=p=>db.doc('profiles/'+uid).update(p).catch(()=>toast('Ошибка сохранения'));
function reward(id){const v=vids.find(x=>x.id===id);if(v&&v.uid!==uid)db.doc('profiles/'+v.uid).update({coins:((PR[v.uid]||{}).coins||0)+1}).catch(()=>{})}
function av(p,s){p=p||{};return p.avatar?`<img src="${esc(p.avatar)}" style="width:${s}px;height:${s}px;border-radius:50%;object-fit:cover;border:3px solid ${isPrem(p)?'#ffc83d':'var(--card)'}">`:`<div style="width:${s}px;height:${s}px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;border:3px solid ${isPrem(p)?'#ffc83d':'var(--card)'}">${esc((p.name||'?')[0]).toUpperCase()}</div>`}
function askName(){
  modal('Профиль · v11','<input type="text" id="nn" maxlength="20" placeholder="Имя"><input type="text" id="un" maxlength="20" placeholder="юзернейм (a-z, 0-9, _)"><button class="btn" id="ok">Готово</button>');
  $('#nn').value=S.name||'';$('#un').value=P?P.username:(window.LOGIN_NAME||'');
  $('#ok').onclick=async()=>{
    const n=$('#nn').value.trim(),u=$('#un').value.trim().toLowerCase().replace(/^@/,'');
    if(!n||!/^[a-z0-9_]{3,20}$/.test(u))return toast('Юзернейм: 3–20 символов, a-z, 0-9, _');
    try{
      if(!P||P.username!==u){const s=await db.doc('usernames/'+u).get();if(s.exists&&s.data().uid!==uid){
          const old=s.data().uid,op=PR[old];
          if(op&&op.auth)return toast('Юзернейм занят: у него уже есть аккаунт с паролем');
          if(op&&!confirm('Юзернейм @'+u+' уже создан до входа по паролю. Это твой старый аккаунт? Нажми ОК, чтобы перенести в новый аккаунт его баланс, подарки и профиль.'))return toast('Перенос отменён');
          window.MIG=op||null;
          for(const i of ITEMS.filter(x=>x.owner===old))await db.doc('items/'+i.id).update({owner:uid});
        }
        await db.doc('usernames/'+u).set({uid});if(P)await db.doc('usernames/'+P.username).delete().catch(()=>{})}
      await db.doc('profiles/'+uid).set({...(P||window.MIG||{coins:30}),name:n,username:u,uid,auth:true,created:(P&&P.created)||(window.MIG&&window.MIG.created)||Date.now()});
      if(window.MIG){await db.doc('profiles/'+window.MIG.uid).delete().catch(()=>{});window.MIG=null}
      S.name=n;store.set('name',n);closeModal();
    }catch(e){toast('Ошибка')}};
}
$('#rn').onclick=askName;
function renderProf(){
  const p=P,b=$('#prof');if(!p){b.innerHTML='';return}
  const f=FONTS[p.font]||'inherit';
  b.innerHTML=`<div class="ban" style="background:${bnr(p)}"></div><div style="display:flex;gap:12px;align-items:flex-end;position:relative">${av(p,68)}<div><div style="font:800 20px ${f}">${nameHTML(p)}</div><small style="color:var(--muted)">@${esc(p.username)}</small></div><div style="margin-left:auto;font-weight:800">${CUR} ${p.coins||0}</div></div>
  <div class="row"><span>Подарки: ${G.map(g=>g.emoji).join(' ')||'пока нет'}</span></div>
  <div class="row"><button class="btn" id="bn" ${p.bonus===new Date().toDateString()?'disabled':''}>Бонус +25 ${CUR}</button><button class="btn alt" id="ap">Сменить аватар</button></div>
  <div class="dots" style="margin:8px 0">${BANNERS.map((x,i)=>`<div class="dot" data-i="${i}" style="background:${x}"></div>`).join('')}</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">${Object.keys(FONTS).map(k=>`<span class="chip ${p.font===k?'on':''}" style="font-family:${FONTS[k]}">${k}</span>`).join('')}</div>`;
  $('#bn').onclick=()=>save({coins:(p.coins||0)+25,bonus:new Date().toDateString()});
  b.querySelectorAll('.dot').forEach(d=>d.onclick=()=>save({banner:BANNERS[d.dataset.i]}));
  b.querySelectorAll('.chip').forEach(c=>c.onclick=()=>save({font:c.textContent}));
  $('#ap').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;if(f.size>5e6)return toast('До 5 МБ');try{const a=await claude.use('assets');save({avatar:(await a.upload(f)).url})}catch(e){toast('Не удалось загрузить')}};i.click()};
}
function renderList(){
  const keep=($('#fu')||{}).value||'';
  $('#list').innerHTML=`<div class="box"><b>Добавьте друга по юзернейму</b><div style="display:flex;gap:8px;margin-top:8px"><input type="text" id="fu" placeholder="@username" autocapitalize="none"><button class="btn" id="fa">Добавить</button></div></div><div class="item" data-t="gen"><div style="font-size:32px">🌍</div><div><b>Общий чат</b><small>Все участники</small></div></div>`+
  TH.sort((a,b)=>b.ts-a.ts).map(t=>{const p=PR[t.members.find(m=>m!==uid)]||{};return `<div class="item" data-t="${esc(t.id)}">${av(p,44)}<div><b>${nameHTML(p)}</b><small>@${esc(p.username||'')} ${t.last?'· '+esc(t.last):''}</small></div></div>`}).join('');
  $('#fu').value=keep;$('#fa').onclick=addFriend;
}
$('#list').onclick=e=>{const i=e.target.closest('.item');if(!i)return;
  if(i.dataset.t==='gen')return openConv({path:'messages',title:'Общий чат',gen:1});
  const t=TH.find(x=>x.id===i.dataset.t),o=t.members.find(m=>m!==uid);
  openConv({path:'threads/'+t.id+'/msgs',title:(PR[o]||{}).name||'Чат',tid:t.id,other:o})};
async function addFriend(){
  const u=$('#fu').value.trim().toLowerCase().replace(/^@/,'');if(!u||!db)return;
  try{const s=await db.doc('usernames/'+u).get();if(!s.exists)return toast('Пользователь не найден');
    const o=s.data().uid;if(o===uid)return toast('Это вы 🙂');
    const tid=[uid,o].sort().join('_');
    if(!TH.find(t=>t.id===tid))await db.doc('threads/'+tid).set({members:[uid,o],ts:Date.now(),last:''});
    $('#fu').value='';openConv({path:'threads/'+tid+'/msgs',title:(PR[o]||{}).name||u,tid,other:o});
  }catch(e){toast('Ошибка')}}
function openConv(c){cur=c;if(unM)unM();
  $('#list').classList.add('hide');$('#ch').classList.add('on');$('#ct').textContent=c.title;$('#gf').style.display=c.tid?'':'none';$('#msgs').innerHTML='';
  unM=db.collection(c.path).orderBy('ts','asc').limit(300).onSnapshot(renderMsgs,()=>toast('Чат недоступен'))}
$('#bk').onclick=()=>{if(unM)unM();unM=null;$('#ch').classList.remove('on');$('#list').classList.remove('hide')};
function renderMsgs(snap){
  const box=$('#msgs'),end=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.innerHTML=snap.docs.map(d=>{const m=d.data(),me=m.uid===uid;
    const t=m.ts?new Date(m.ts).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):'';
    if(m.gift)return `<div class="m gift ${me?'me':''}">${m.gift}<span class="t" style="font-size:12px;color:var(--muted)">${me?'Вы подарили':esc(m.name||'?')+' дарит'} · ${m.price} ${CUR}</span></div>`;
    return `<div class="m ${me?'me':''}">${me||!cur.gen?'':`<span class="n">${nameHTML(PR[m.uid]||{name:m.name})}</span>`}${esc(m.text)}<span class="t">${t}</span></div>`}).join('')||'<div class="empty">Пока пусто 👋</div>';
  if(end)box.scrollTop=box.scrollHeight}
$('#f').onsubmit=async e=>{e.preventDefault();const t=$('#inp').value.trim();if(!t||!db)return;$('#inp').value='';
  try{await db.collection(cur.path).add({text:t,name:S.name,uid,ts:Date.now()});
    if(cur.tid)db.doc('threads/'+cur.tid).update({last:t.slice(0,40),ts:Date.now()});
    const m=$('#msgs');m.scrollTop=m.scrollHeight}catch(er){toast('Не удалось отправить');$('#inp').value=t}};
$('#gf').onclick=()=>{
  modal('Подарок · у вас '+(P?P.coins||0:0)+' '+CUR,'<div class="gg">'+GIFTS.map(g=>`<button data-e="${g[0]}" data-p="${g[1]}">${g[0]}<small>${g[1]} ${CUR}</small></button>`).join('')+'</div>');
  $('#mb').onclick=async e=>{const b=e.target.closest('.gg button');if(!b)return;const pr=+b.dataset.p,em=b.dataset.e;
    if(!P||(P.coins||0)<pr)return toast('Не хватает '+CUR);
    closeModal();
    try{await save({coins:P.coins-pr});
      await db.collection(cur.path).add({gift:em,price:pr,name:S.name,uid,ts:Date.now()});
      await db.collection('gifts').add({to:cur.other,emoji:em,from:S.name,ts:Date.now()});
      db.doc('threads/'+cur.tid).update({last:em+' подарок',ts:Date.now()});toast('Подарок отправлен 🎁')}catch(er){toast('Ошибка')}}};

/* ---- тележкоины, коллекционные подарки ---- */
const GM={};[['bear','Мишка','🧸',30,5000,'Обычный'],['rose','Роза','🌹',60,3000,'Обычный'],['cake','Торт','🎂',120,2000,'Редкий'],['gem','Алмаз','💎',300,1000,'Эпический'],['rocket','Ракета','🚀',700,500,'Эпический'],['crown','Корона','👑',1500,100,'Легендарный']].forEach(a=>GM[a[0]]={id:a[0],n:a[1],e:a[2],price:a[3],supply:a[4],rar:a[5]});
const GL=Object.values(GM),PT=['✦','❄','♥','☆','✿','●'],BD=[['#ff9a9e','#fad0c4'],['#a18cd1','#fbc2eb'],['#84fab0','#8fd3f4'],['#f6d365','#fda085'],['#667eea','#764ba2'],['#43e97b','#38f9d7'],['#fa709a','#fee140'],['#30cfd0','#330867']];
let ITEMS=[],paying=0;
function card(it){const g=GM[it.type];return `<div class="gc ${it.shown?'sh':''} ${g.rar==='Легендарный'?'leg':''}" data-i="${it.id||''}" style="background:linear-gradient(160deg,${BD[it.bd][0]},${BD[it.bd][1]})"><div class="pt">${(PT[it.pt]+' ').repeat(30)}</div><i class="r">${g.rar}</i><div class="ge a-${g.id}">${uq(g.svg||g.e)}</div><b>${g.n}</b><small>${it.serial==='?'?'тираж '+g.supply:'#'+it.serial+' из '+g.supply}</small></div>`}
function postReward(){if(P&&P.postDay!==new Date().toDateString()){save({coins:(P.coins||0)+5,postDay:new Date().toDateString()});toast('+5 🪙 за первое видео дня')}}
function checkLikes(){if(!P||paying)return;
  const tot=vids.filter(v=>v.uid===uid).reduce((a,v)=>a+(likes[v.id]||[]).filter(x=>x!==uid).length,0),b=Math.floor(tot/10)-(P.blocks||0);
  if(b>0){paying=1;save({coins:(P.coins||0)+10*b,blocks:(P.blocks||0)+b}).then(()=>{paying=0;toast('+'+10*b+' 🪙 за лайки')})}}
const _rf=renderFeed;renderFeed=function(){_rf();checkLikes()};
function reward(){}
function renderProf(){
  const p=P,b=$('#prof');if(!p){b.innerHTML='';return}
  const f=FONTS[p.font]||'inherit',mine=ITEMS.filter(i=>i.owner===uid).sort((a,c)=>c.ts-a.ts),td=new Date().toDateString();
  b.innerHTML=`<div class="ban" style="background:${bnr(p)}"></div><div style="display:flex;gap:12px;align-items:flex-end;position:relative">${av(p,68)}<div><div style="font:800 20px ${f}">${nameHTML(p)}</div><small style="color:var(--muted)">@${esc(p.username)}</small></div><div style="margin-left:auto;text-align:right"><b style="font-size:18px">🪙 ${p.coins||0}</b><small style="display:block;color:var(--muted)">тележкоины</small></div></div>
  <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" id="bn" ${p.bonus===td?'disabled':''}>Ежедневный бонус</button><button class="btn" id="sh">🛍 Магазин</button><button class="btn alt" id="ap">Аватар</button></div>
  <small style="color:var(--muted)">Как заработать тележкоины: заходить каждый день (серия растёт, максимум 5 за день), первое видео за день даёт 5, каждые 10 лайков на твоих видео дают 10. Тап по подарку выставляет его в профиль или убирает.</small>
  <h3 style="margin:14px 0 8px">Мои подарки (${mine.length})</h3><div class="gg" id="inv">${mine.map(card).join('')||'<small>Пока пусто — загляни в магазин</small>'}</div>
  <div class="dots" style="margin:12px 0">${BANNERS.map((x,i)=>`<div class="dot" data-i="${i}" style="background:${x}"></div>`).join('')}</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">${Object.keys(FONTS).map(k=>`<span class="chip ${p.font===k?'on':''}" style="font-family:${FONTS[k]}">${k}</span>`).join('')}</div>`;

[['frogh','Лягушонок с сердцем','🐸',600,500,'Эпический'],['ringbox','Кольцо в коробке','💍',1800,120,'Легендарный'],['watch','Часы','⌚',1300,250,'Легендарный'],['icecream','Мороженое','🍦',70,3000,'Обычный'],['donut','Пончик','🍩',55,3500,'Обычный'],['horseshoe','Подкова','🍀',260,1200,'Редкий'],['letter','Письмо','💌',130,2000,'Редкий'],['giftbox','Подарочная коробка','🎁',150,2000,'Редкий'],['coffee','Кофе','☕',45,4000,'Обычный']].forEach(a=>{GM[a[0]]={id:a[0],n:a[1],e:a[2],svg:SV[a[0]],price:a[3],supply:a[4],rar:a[5]};GL.push(GM[a[0]])});

/* подарок рядом с ником + титул (только Премиум; другие видят их, пока у владельца Премиум) */
function nameHTML(p){const n=esc((p&&p.name)||'?');if(!isPrem(p))return n;const g=NFX[p.nickFx];
  let h=(g?`<span style="background:${g};-webkit-background-clip:text;background-clip:text;color:transparent">${n}</span>`:n)+' ⭐';
  const it=p.pin&&ITEMS.find(i=>i.id===p.pin&&i.owner===p.uid),Gf=it&&GM[it.type];
  if(Gf)h+=` <span class="pg">${uq(Gf.svg||Gf.e)}</span>`;
  if(p.title)h+=` <span class="tt">${esc(p.title)}</span>`;return h}
const TT=[['Новичок',()=>true,'для всех'],['Коллекционер',()=>ITEMS.filter(i=>i.owner===uid).length>=5,'иметь 5 подарков'],['Богач',()=>(P.coins||0)>=3000,'3000 🪙 на балансе'],['Постоянный',()=>(P.streak||0)>=7,'7 дней подряд'],['Популярный',()=>(P.blocks||0)>=3,'30 лайков на видео'],['Азартный',()=>ITEMS.some(i=>i.owner===uid&&i.from==='Апгрейд'),'выиграть подарок в апгрейде'],['Легенда',()=>ITEMS.some(i=>i.owner===uid&&GM[i.type]&&GM[i.type].rar==='Легендарный'),'иметь легендарный подарок']];
function addTitles(){const b=$('#pbox');if(!b||!P||!isPrem(P))return;
  const ok=TT.filter(t=>t[1]()).map(t=>t[0]);if(P.ctitle)ok.push(P.ctitle);
  b.insertAdjacentHTML('beforeend','<h3 style="margin-top:12px">🏷 Титул рядом с ником</h3><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip '+(!P.title?'on':'')+'" data-tt="">Без титула</span>'+ok.map(n=>`<span class="chip ${P.title===n?'on':''}" data-tt="${esc(n)}">${esc(n)}</span>`).join('')+'</div><small style="color:var(--muted);display:block;margin-top:6px">Закрытые титулы: '+TT.filter(t=>!t[1]()).map(t=>t[0]+' — '+t[2]).join('; ')+'. Подарок рядом с ником: открой подарок в «Мои подарки» → «Показывать рядом с ником».</small>');
  b.querySelectorAll('[data-tt]').forEach(c=>c.onclick=()=>save({title:c.dataset.tt}))}
const _rpm=renderPrem;renderPrem=function(){_rpm();addTitles()};
function itemMenu(e){const c=e.target.closest('.gc');if(!c)return;const it=ITEMS.find(x=>x.id===c.dataset.i);if(!it)return;
  const g=GM[it.type],sell=Math.floor(g.price*.6);
  modal(g.n,`<div style="width:150px;margin:auto">${card(it)}</div><button class="btn alt" id="i1">${it.shown?'Убрать из профиля':'📌 Выставить в профиль'}</button>${isPrem(P)?`<button class="btn alt" id="i4">${P.pin===it.id?'Убрать из-рядом с ником':'📍 Показывать рядом с ником'}</button>`:'<small style="text-align:center;color:var(--muted)">⭐ Подарок рядом с ником доступен с Премиумом</small>'}<button class="btn alt" id="i3">💰 Продать · ${sell} 🪙</button>`);
  $('#i1').onclick=()=>{db.doc('items/'+it.id).update({shown:!it.shown});closeModal()};
  if($('#i4'))$('#i4').onclick=()=>{save({pin:P.pin===it.id?'':it.id});closeModal()};
  $('#i3').onclick=async()=>{if(!confirm('Продать за '+sell+' 🪙?'))return;closeModal();
    try{await db.doc('items/'+it.id).delete();await save({coins:(P.coins||0)+sell});toast('+'+sell+' 🪙')}catch(er){toast('Ошибка')}}}

/* ---- boot ---- */
async function boot(){
  applyTheme();
  $('#who').textContent=S.name;$('#nm').textContent=S.name||'—';
  let timer=setTimeout(()=>{if(!db)$('#feed').innerHTML='<div class="empty"><div class="big">🔒</div>Не удалось подключиться к базе.<br>Проверь config.js и правила Firestore.</div>'},10000);
  try{
    const user=await claude.use('user');
    if(user){uid=await user.id();store.set('uid',uid)}
    db=await claude.use('db');
  }catch(e){}
  if(!uid){uid='u'+Math.random().toString(36).slice(2,10);store.set('uid',uid)}
  
  if(!db)return;
  clearTimeout(timer);
  let first=1;
  db.collection('profiles').onSnapshot(s=>{s.docs.forEach(d=>PR[d.id]=d.data());P=PR[uid]||null;
    if(P){S.name=P.name;$('#who').textContent=P.name+' · 🪙 '+(P.coins||0);$('#nm').textContent=P.name+' @'+P.username}else if(first)askName();
    first=0;renderProf();renderList()});
  db.collection('items').onSnapshot(s=>{ITEMS=s.docs.map(d=>({id:d.id,...d.data()}));renderProf()});
  db.collection('threads').where('members','array-contains',uid).onSnapshot(s=>{TH=s.docs.map(d=>({id:d.id,...d.data()}));renderList()});
  db.collection('likes').onSnapshot(s=>{likes={};s.docs.forEach(d=>{const x=d.data();(likes[x.vid]=likes[x.vid]||[]).push(x.uid)});renderFeed()});
  db.collection('videos').orderBy('ts','desc').limit(50).onSnapshot(s=>{vids=s.docs.map(d=>({id:d.id,...d.data()}));renderFeed()},()=>toast('Лента недоступна'));
}
boot();
